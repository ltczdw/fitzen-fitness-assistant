name: Project smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install --no-deps --no-build-isolation -e backend
          python -m pip check
          npm ci --prefix frontend
      - name: Run the core smoke suite
        run: python scripts/check_project.py --smoke
      - name: Check the public file manifest
        run: python scripts/export_release.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-results
          path: |
            evidence/project-checks/*/*.log
            evidence/project-checks/*/*.xml
            evidence/project-checks/*/summary.json
          if-no-files-found: error
          retention-days: 7
