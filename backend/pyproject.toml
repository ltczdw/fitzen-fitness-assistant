[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-assistant-backend"
version = "0.1.0"
description = "Fitness assistant backend with bounded Agent, RAG and MCP modules"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "jsonschema>=4.26.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "fastmcp>=4.0.3,<5",
  "langgraph>=0.2",
  "redis>=5.0,<8",
  "langsmith>=0.12,<1",
  "pgvector>=0.3",
  "tokenizers>=0.23.3,<0.24",
]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.setuptools.package-data]
app = ["static/*.html", "vendor/deepseek_v41/*.json",
       "vendor/deepseek_v41/LICENSE", "vendor/deepseek_v41/UPSTREAM_README.md"]

